[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cestos-platform"
version = "0.1.0"
description = "Cestos operations platform foundation"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.52,<1", "sqlalchemy[asyncio]>=2.0.38,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2", "pydantic-settings>=2.7,<3", "email-validator>=2.2,<3", "PyJWT>=2.10,<3", "argon2-cffi>=23.1", "python-multipart>=0.0.18", "structlog>=25.1,<27"]

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=1.4,<2", "httpx>=0.28,<1", "ruff>=0.16.6,<1", "mypy>=1.15,<2", "pre-commit>=4,<5"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic", "app/tests"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: requires a separate PostgreSQL test database"]
