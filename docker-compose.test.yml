services:
  postgres-test:
    image: postgres:17
    environment:
      POSTGRES_USER: cestos_test
      POSTGRES_PASSWORD: cestos_test_local
      POSTGRES_DB: cestos_test
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cestos_test -d cestos_test"]
      interval: 2s
      timeout: 3s
      retries: 30
