# fly.toml app configuration file generated for cestos-oversight on 2026-09-09T11:22:51Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'cestos-oversight'
primary_region = 'lhr'

[build]

[deploy]
  release_command = "/srv/cestos/.venv/bin/python /srv/cestos/scripts/migrate.py"

[env]
  APP_ENV = 'production'
  LOGIN_SESSION_HOURS = '12'
  ACCESS_TOKEN_EXPIRE_MINUTES = '720'
  PUBLIC_BASE_URL = 'https://cestos.qoteport.workers.dev'
  LOG_LEVEL = 'info'
  PORT = '8000'
  TZ = 'UTC'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = 'GET'
    path = '/health'
    interval = '1m'
    timeout = '10s'
    grace_period = '60s'

[[vm]]
  memory = '1024mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

[[metrics]]
  port = 9091
  path = '/metrics'
