# fly.toml app configuration file generated for cestos-oversight on 2026-09-09T11:22:51Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'cestos-oversight'
primary_region = 'lhr'

[build]

[env]
  APP_ENV = 'production'
  LOG_LEVEL = 'info'
  PORT = '8000'
  TZ = 'UTC'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512

[[metrics]]
  port = 9091
  path = '/metrics'
